<!DOCTYPE>
<html lang="zh-CN">
<head meta="utf-8">
<style>
body{width:1500px;height:1000px}
div{width:60%;height:60%;border:2px solid black;margin-left:500px}
button{width:5%;height:20px;border:2px solid black;margin-left:1500px}
input{width:50%;height:20px;border:2px solid black;margin-left:500px}
</style>
</head>
<body>
<div id="div"></div>
<button onclick="send()">发送</button>
<input id="input" type="text">
<script>
let chat=document.getElementById("div");
let put=document.getElementById("input");
function send(){t=put.value;
               chat.innerHTML+="<p>我"+t+"</p>";
                put.value=""
               }
</script>
</body>
</html>
