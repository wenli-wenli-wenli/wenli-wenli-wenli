<!DOCTYPE>
<html lang="zh-CN">
<head meta="utf-8">
<style>
body{width:70%;height:80%}
div{width:60%;height:60%;border:2px solid black;margin-left:500px}
button{width:10%;height:20%;border:2px solid black;margin-left:800px}
input{width:30%;height:20%;border:2px solid black;margin-left:500px;margin-bottom:600px}
</style>
</head>
<body>
<div id="div"></div>
<button onclick="send()">发送</button>
<input id="input" type="text">
<script>
let chat=document.getElementById("div");
let put=document.getElementById("input");
function send(){t=put.value;
               chat.innerHTML+="<p>我"+t+"</p>";
                put.value=""
               }
</script>
</body>
</html>
