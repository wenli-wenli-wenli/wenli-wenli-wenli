<!DOCTYPE>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
body{margin:20px}
body *{border:2px solid black;display:inline-block;font-size:16px;vertical-align:middle}
body>div{width:500px;height:400px;padding:10px;overflow-y:auto}
body>button{width:40px;height:30px}
body>input{width:980px;height:30px}
</style>
</head>
<body>
<div id="div"></div>
<button onclick="send()">发送</button>
<input id="input" type="text">
<script>
let chat=document.getElementById("div");
let put=document.getElementById("input");
function send(){t=put.value;
               chat.innerHTML+="<p>我"+t+"</p>";
                put.value=""
               }
</script>
</body>
</html>
