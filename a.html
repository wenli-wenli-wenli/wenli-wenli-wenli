<!DOCTYPE>
<html lang="zh-CN">
<head meta="utf-8">
<style>
body{width:1500px;height:1000px}
body*{border:3px solid black;display:inline-block;font-size:3px}
body>div{width:500px;height:400px;padding:200px}
body>button{width:20px;height:5px}
body>input{width:980px;height:5px}
</style>
</head>
<body>
<div id="div"></div>
<button onclick="send()">发送</button>
<input id="input" type="text">
<script>
let chat=document.getElementById("div");
let put=document.getElementById("input");
function send(){t=put.value;
               chat.innerHTML+="<p>我"+t+"</p>";
                put.value=""
               }
</script>
</body>
</html>
