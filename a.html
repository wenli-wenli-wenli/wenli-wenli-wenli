<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>简易聊天室</title>
<!-- socket.io CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
body{max-width:800px;margin:30px auto;font-size:16px;}
#box{height:450px;border:1px solid #ccc;padding:15px;overflow:auto;margin-bottom:15px;border-radius:8px;background:#f9f9f9;}
#text{width:70%;padding:12px;font-size:16px;border:1px solid #ccc}
button{padding:12px 24px;font-size:16px;background:#2b78e4;color:white;border:none;border-radius:6px;cursor:pointer;margin-left:8px}
</style>
</head>
<body>
<h2>聊天框</h2>
<div id="box"></div>
<input type="text" id="text" placeholder="输入消息">
<button onclick="send()">发送</button>

<script>
const chatBox = document.getElementById("box");
const inputEle = document.getElementById("text");

// =========这里改成你的Render域名=========
const socket = io("https://qqqqqqsssss.onrender.com");

// 连接状态打印，F12控制台看
socket.on("connect", ()=>{
    console.log("✅连接成功");
});
socket.on("connect_error", (err)=>{
    console.log("🔴连接失败：", err.message);
});
socket.on("disconnect", ()=>{
    console.log("❌断开连接");
});

// 发送消息
function send(){
    let msg = inputEle.value.trim();
    if(!msg) return;
    socket.emit("chat", msg);
    chatBox.innerHTML += `<p>我: ${msg}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    inputEle.value = "";
}

// 接收别人广播过来的消息
socket.on("chat", (res)=>{
    chatBox.innerHTML += `<p>对方: ${res}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
})
</script>
</body>
</html>

</script>
</body>
</html>
