<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的聊天室</title>
<style>
body{max-width:800px;margin:30px auto,font-size:16px;}
#box{height：450px;border:1px solid #ccc,padding:15px;pverflow:auto;margin-bottom:15px;border-radius:8px;background:#f9f9f9;}
#text{width:70%;padding:12px;font-size:16px;border:1px solid #ccc}
#button{padding:12px 24px;font-size:16px;background:#2b78e4;color:white;border:none;border-radius:6px;cursor:pointer;margin-left:8px}
</style>
</head>
<body>
<h2>聊天框</h2>
<div id="box"></div>
<input type="text" id="text" placeholder="输入">
<button id="button" placeholder="发送"></button>
<script>
let chat=document.getElementByld("box")
let put=document.getElementByld("text")
let btn=document.getElementByld("button")
function send(){let text=put.value;
            text=text.trim();
            if (text==""){return;}
            chat.innerHTML==chat.innerHTML+"<p>"+text+"</p>";
            put.value="";
btn.onclick=send;
</script>
</body>
</html>
