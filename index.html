<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>我的公开聊天室</title>
<style>
body{max-width:800px;margin:20px auto}
#chat{height:400px;border:1px solid #ccc;padding:10px;overflow:auto;margin-bottom:10px}
</style>
</head>
<body>
<h2>简易聊天室</h2>
<div id="chat"></div>
<input type="text" id="msg" placeholder="输入消息">
<button onclick="send()">发送</button>
<script>
function send(){
  let txt = document.getElementById("msg").value;
  document.getElementById("chat").innerHTML += `<p>${txt}</p>`;
  document.getElementById("msg").value = "";
}
</script>
</body>
</html>
